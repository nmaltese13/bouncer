[project]
# The distribution name is `agent-bouncer` because `bouncer` on PyPI is an
# unrelated 2014 authorization library. The import package stays `bouncer`.
name = "agent-bouncer"
version = "0.1.2"
description = "A policy enforcement point for agent spending: blocks transactions that violate a declarative policy and writes a tamper-evident, signed audit log of every decision."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Nicholas Maltese" }]
keywords = ["agents", "payments", "policy", "audit", "authorization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# Runtime dependencies are deliberately few. See ROADMAP.md before adding one.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "cryptography>=42.0",
    "pyyaml>=6.0",
    # Not a capability, a data file: zoneinfo reads the IANA database from the
    # OS, and Windows ships none. Without it every `time_windows.timezone` —
    # including "UTC" — fails policy validation, which denies everything.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # starlette's TestClient requires httpx2; httpx is only the legacy fallback.
    "httpx2>=0.28",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "types-pyyaml>=6.0",
]

[project.scripts]
bouncer = "bouncer.cli:main"

[project.urls]
Source = "https://github.com/nmaltese13/bouncer"
Issues = "https://github.com/nmaltese13/bouncer/issues"
Changelog = "https://github.com/nmaltese13/bouncer/releases"
Security = "https://github.com/nmaltese13/bouncer/blob/main/SECURITY.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bouncer"]

[tool.hatch.build.targets.sdist]
# Tests and examples ship so the sdist is buildable and verifiable. The demo
# recording does not: it is 2.4 MB against a 77 KB library, and the README
# references it by absolute URL.
exclude = ["docs/demo.gif", "/.github", "/scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["bouncer", "tests", "examples"]

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true
